<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lost & Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎒 Campus Lost & Found</h1>
    <p>Lost something? Find it here!</p>
  </header>

  <main>
    <section class="form-box">
      <h2>Report an Item</h2>
      <form id="itemForm">
        <input id="name" placeholder="Item name (e.g. Black Wallet)" required>

        <select id="status">
          <option value="Lost">I Lost This</option>
          <option value="Found">I Found This</option>
        </select>

        <select id="category">
          <option>Electronics</option>
          <option>Books</option>
          <option>Clothing</option>
          <option>Accessories</option>
          <option>Other</option>
        </select>

        <input id="location" placeholder="Location on campus" required>
        <input id="date" type="date" required>
        <textarea id="description" placeholder="Description (optional)"></textarea>

        <button type="submit">Submit Report</button>
      </form>
    </section>

    <section>
      <h2>Reported Items</h2>
      <input id="search" placeholder="Search items or locations...">

      <div id="items" class="items"></div>
      <p id="empty"></p>
    </section>
  </main>

  <footer>Campus Lost & Found </footer>
  <script src="script.js"></script>
</body>
</html>
